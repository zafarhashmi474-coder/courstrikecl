<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Search Optimization | Courstrike</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-dark:#090a0f;
      --bg-card:#12141c;
      --bg-card-hover:#181b26;
      --text-primary:#fff;
      --text-secondary:#9499ad;
      --accent-blue:#ff0000;
      --accent-orange:#ff6600;
      --border-color:rgba(255,255,255,.08);
    }
    * { box-sizing:border-box; margin:0; padding:0; }
    html { scroll-behavior:smooth; }
    body {
      min-height:100vh; background:var(--bg-dark); color:var(--text-primary);
      font-family:'Plus Jakarta Sans',Arial,sans-serif; line-height:1.6;
    }
    a { color:inherit; text-decoration:none; }
    .container { width:min(1160px,calc(100% - 40px)); margin:auto; }
    .navbar {
      position:sticky; top:0; z-index:10; background:rgba(9,10,15,.9);
      backdrop-filter:blur(16px); border-bottom:1px solid var(--border-color);
    }
    .nav {
      min-height:78px; display:flex; align-items:center; justify-content:space-between; gap:20px;
    }
    .logo img { height:58px; width:auto; object-fit:contain; }
    .nav-links { display:flex; gap:28px; align-items:center; }
    .nav-links a { color:#fff; font-weight:600; font-size:.92rem; }
    .nav-links a:hover { color:var(--accent-orange); }
    .btn {
      display:inline-flex; align-items:center; justify-content:center; border-radius:999px;
      padding:12px 22px; font-weight:700; border:1px solid var(--accent-orange);
      transition:.25s ease; cursor:pointer;
    }
    .btn-primary { background:var(--accent-orange); color:#fff; border-color:var(--accent-orange); }
    .btn-primary:hover { transform:translateY(-2px); background:#ff0000; }
    .hero {
      min-height:calc(100vh - 78px); display:flex; align-items:center; padding:80px 0;
    }
    .hero-grid { display:grid; grid-template-columns:1.2fr .8fr; gap:60px; align-items:center; }
    .eyebrow {
      display:inline-flex; padding:7px 14px; border:1px solid rgba(255,255,255,.12);
      border-radius:999px; color:#fff; background:rgba(255,255,255,.05);
      text-transform:uppercase; font-size:.75rem; font-weight:700; letter-spacing:.08em;
      margin-bottom:22px;
    }
    h1 { font-size:clamp(2.6rem,6vw,5rem); line-height:1.05; letter-spacing:-.04em; margin-bottom:24px; }
    .lead { color:var(--text-secondary); font-size:1.15rem; max-width:680px; }
    .card {
      background:var(--bg-card); border:1px solid rgba(255,255,255,.1);
      border-radius:20px; padding:34px; box-shadow:0 20px 60px rgba(0,0,0,.3);
    }
    .card h2 { font-size:1.3rem; margin-bottom:12px; }
    .card p { color:var(--text-secondary); }
    .actions { display:flex; gap:12px; flex-wrap:wrap; margin-top:34px; }
    .back { border-color:rgba(255,255,255,.18); background:transparent; }
    footer { border-top:1px solid var(--border-color); padding:28px 0; color:var(--text-secondary); font-size:.85rem; }
    @media(max-width:800px) {
      .nav-links { display:none; }
      .hero { padding:60px 0; }
      .hero-grid { grid-template-columns:1fr; gap:30px; }
      .container { width:min(100% - 28px,1160px); }
    }
  </style>
</head>
<body>
  <header class="navbar">
    <div class="container nav">
      <a class="logo" href="index.html">
        <img src="images/Logo.svg.svg" alt="Courstrike">
      </a>
      <nav class="nav-links">
        <a href="index.html">Home</a>
        <a href="javascript:void(0)" onclick="window.location.href='index.html';">Workshops</a>
        <a href="index.html#events">Events</a>
        <a href="index.html#about">About</a>
      </nav>
      <a class="btn btn-primary" href="index.html">Get Started</a>
    </div>
  </header>

  <main class="hero">
    <div class="container hero-grid">
      <section>
        <div class="eyebrow">Courstrike Workshops</div>
        <h1>AI Search Optimization</h1>
        <p class="lead">Optimize your content for AI search.</p>
        <div class="actions">
          <a class="btn btn-primary" href="index.html">Back to Workshops</a>
          <a class="btn back" href="index.html#about">About Courstrike</a>
        </div>
      </section>
      <aside class="card">
        <h2>AI Search Optimization</h2>
        <p>Optimize your content for AI search.</p>
      </aside>
    </div>
  </main>

  <footer>
    <div class="container">© Courstrike. All rights reserved.</div>
  </footer>
</body>
</html>
