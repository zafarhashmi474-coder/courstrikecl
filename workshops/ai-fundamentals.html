<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>AI Fundamentals | Courstrike</title>

    <link
        rel="stylesheet"
        href="../css/style.css"
    >

    <style>

        .workshop-page {

            min-height: 100vh;

            padding:
                170px 30px 100px;

            max-width: 1120px;

            margin: auto;

        }

        .workshop-page-label {

            display: inline-block;

            padding:
                8px 15px;

            border:
                1px solid
                rgba(255,255,255,0.2);

            border-radius: 30px;

            color: #ffd429;

            font-size: 13px;

            font-weight: 700;

            margin-bottom: 25px;
        }

        .workshop-page h1 {

            font-size:
                clamp(45px, 7vw, 80px);

            line-height: 1;

            letter-spacing: -3px;

            margin-bottom: 25px;

        }

        .workshop-page p {

            max-width: 700px;

            font-size: 20px;

            line-height: 1.6;

            color: #c9c9c9;

        }

    </style>

</head>


<body>

    <div id="header"></div>


    <main class="workshop-page">

        <div class="workshop-page-label">
            CORE WORKSHOP
        </div>

        <h1>
            AI Fundamentals
        </h1>

        <p>
            Work smarter with AI tools. Build practical
            AI capabilities and learn how to use modern
            AI tools effectively in your workflow.
        </p>

    </main>


    <div id="footer"></div>


    <script src="../js/components.js"></script>

</body>

</html>
